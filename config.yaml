# General
# seeds: [1, 2, 3, 4, 5]  # explicit list of seeds
seed_arange: 20 # generates seeds 1 to n (overrides seeds if set)

tree_sim:
  dir: "results/sim/tree/{tree_sim_tool}/{tree_params}/seed{seed}.nwk"
  tools:
    evolver:
      species: []
      birth_death:
        - {birth: 1.0, death: 2.0}
      sampling_fraction: [0.25]
      mutation_rate: [1.0]
      path_snippet: "s{species}_b{birth}_d{death}_f{sampling_fraction}_m{mutation_rate}"
    iqtree:
      species: []
      # # what should the max be?
      blen:
        # - {mean: 0.2, species: 8} 
        # - {mean: 0.1, species: 16} 
        # - {mean: 0.05, species: 32} 
        # - {mean: 0.025, species: 64}
        #
        # - {mean: 0.1, species: 8}
        # - {mean: 0.05, species: 16}
        # - {mean: 0.025, species: 32}
        # - {mean: 0.0125, species: 64}
        #
        # - {mean: 0.05, species: 8}
        # - {mean: 0.025, species: 16}
        # - {mean: 0.0125, species: 32}
        # - {mean: 0.00625, species: 64}
        # - {mean: 0.23284823284823292, species: 8}
        # - {mean: 0.16801576371675894, species: 16}
        # - {mean: 0.1307832690392409, species: 32}
        # - {mean: 0.10684072006587403, species: 64}
        # - {mean: 0.29106029106029113, species: 8}
        # - {mean: 0.21001970464594868, species: 16}
        # - {mean: 0.16347908629905109, species: 32}
        # - {mean: 0.13355090008234252, species: 64}
        # - {mean: 0.34927234927234935, species: 8}
        # - {mean: 0.2520236455751384, species: 16}
        # - {mean: 0.1961749035588613, species: 32}
        # - {mean: 0.16026108009881102, species: 64}
      min: 0.0001
      max: 10
      path_snippet: "s{species}_blen{min}_{mean}_{max}"
    dendropy:
      blen:
        - {mean: 0.23284823284823292, species: 8}
        - {mean: 0.16801576371675894, species: 16}
        - {mean: 0.1307832690392409, species: 32}
        - {mean: 0.10684072006587403, species: 64}
        - {mean: 0.29106029106029113, species: 8}
        - {mean: 0.21001970464594868, species: 16}
        - {mean: 0.16347908629905109, species: 32}
        - {mean: 0.13355090008234252, species: 64}
        - {mean: 0.34927234927234935, species: 8}
        - {mean: 0.2520236455751384, species: 16}
        - {mean: 0.1961749035588613, species: 32}
        - {mean: 0.16026108009881102, species: 64}
      path_snippet: "s{species}_blen{mean}"

msa_sim:
  dir: "results/sim/msa/{tree_sim_tool}/{tree_params}/{msa_sim_tool}/{msa_params}/seed{seed}"
  tools:
    tkf:
      # params:
        # - {lambda: 0.03, mu: 0.033, r: 0.8}
        # - {lambda: 0.08, mu: 0.1, r: 0.5}
        # - {lambda: 0.1, mu: 0.2, r: 0.2}
      lm: # TODO: perhaps one less param combi but then also some expected 1000 len seqs
        # - {lambda: 0.001, mu: 0.00105} # for r = 0.8 the mean is 100
        # - {lambda: 0.001, mu: 0.00101} # for r = 0.8 the mean is 500
        - {lambda: 0.003, mu: 0.00315} # for r = 0.8 the mean is 100
        - {lambda: 0.003, mu: 0.00303} # for r = 0.8 the mean is 500
        - {lambda: 0.01, mu: 0.0105} # for r = 0.8 the mean is 100
        - {lambda: 0.01, mu: 0.0101} # for r = 0.8 the mean is 500
        - {lambda: 0.03, mu: 0.0315} # for r = 0.8 the mean is 100
        - {lambda: 0.03, mu: 0.0303} # for r = 0.8 the mean is 500
      r: [0.95, 0.8, 0.7]
      max_insertion: 50
      tkf_root_length: ["sampled", "expected"]
      # tkf_root_length: ["sampled", "1000"]
      model: ["jc69"]
      # perhaps also add this to the alisim (although it might be less likely since we usually? create longer alignments with alisim)
      # empty_leaves: ["retry", "prune"]
      empty_leaves: ["prune"]
      path_snippet: "l{lambda}_mu{mu}_r{r}_max{max_insertion}_len{tkf_root_length}_{model}_empty_leaves_{empty_leaves}"
    alisim:
      model: ["JC"]
      root_length: []
      ir_ip:
        - {ir: 0.006, ip: 0.018}
      path_snippet: "ir{ir}_ip{ip}_len{root_length}_{model}"

param_inf:
  dir: "results/inf/param/{tree_sim_tool}/{tree_params}/{msa_sim_tool}/{msa_params}/{inference_tool}/{inf_params}/seed{seed}"
  tools:
    jati_model_param_search:
      model_gap:
        # - {model: "jc69", gap: "Missing"}
        - {model: "NONE", gap: "TKF92"}
      epsilon: 1e-5
      max_iterations: 5
      path_snippet: "{model}_{gap}_{max_iterations}iter_epsilon{epsilon}"
    iqtree_model_param_search:
      # model: ["JC"]
      model: []
      path_snippet: "{model}"

indel_inf: # with fixed true model parameters
  dir: "results/inf/indel/{tree_sim_tool}/{tree_params}/{msa_sim_tool}/{msa_params}/{inference_tool}/{inf_params}/seed{seed}"
  tools:
    tkf_reestimate:
      max_iterations: 5
      epsilon: 1e-5
      path_snippet: "{max_iterations}iter_epsilon{epsilon}"
    dollo_parsimony:
      path_snippet: "no_params"

indel_and_param_inf:
  dir: "results/inf/indel_and_param/{tree_sim_tool}/{tree_params}/{msa_sim_tool}/{msa_params}/{inference_tool}/{inf_params}/seed{seed}"
  tools:
    jati_asr_and_params:
      start_params:
        - {s_l: 0.01, s_m: 0.02, s_r: 0.5}
      max_iterations: 5
      epsilon: 1e-5
      path_snippet: "l{s_l}_mu{s_m}_r{s_r}_{max_iterations}iter_epsilon{epsilon}"

tree_inf:
  dir: "results/inf/tree/{tree_sim_tool}/{tree_params}/{msa_sim_tool}/{msa_params}/{inference_tool}/{inf_params}/seed{seed}"
  tools:
    jati:
      model_gap_move:
        # - {model: "jc69", gap: "PIP", move: "NNI"}
        # - {model: "jc69", gap: "Missing", move: "NNI"}
        # - {model: "jc69", gap: "Missing", move: "SPR"}
        # - {model: "jc69", gap: "PIP", move: "SPR"}
        # - {model: "jc69", gap: "TKF92", move: "NNI"}
        - {model: "NONE", gap: "TKF92", move: "NNI"}
      max_iterations: 5
      epsilon: 1e-5
      path_snippet: "{model}_{gap}_{move}_{max_iterations}iter_epsilon{epsilon}"
    iqtree:
      model: ["JC"]
      path_snippet: "{model}"
